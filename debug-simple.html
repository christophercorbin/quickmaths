<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Simple Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        #gameCanvas {
            border: 2px solid #34495e;
            background-color: #ecf0f1;
            display: block;
        }
        
        #debug {
            color: white;
            margin-top: 20px;
            font-family: monospace;
            font-size: 14px;
            max-width: 800px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="debug">
        <div>Debug Info:</div>
        <div id="debugOutput">Loading...</div>
    </div>
    
    <script>
        const debugOutput = document.getElementById('debugOutput');
        
        function log(message) {
            console.log(message);
            debugOutput.innerHTML += '<br>' + message;
        }
        
        try {
            log('Starting debug simple game...');
            
            const canvas = document.getElementById('gameCanvas');
            if (!canvas) {
                log('ERROR: Canvas not found!');
                throw new Error('Canvas not found');
            }
            log('Canvas found: ' + canvas.width + 'x' + canvas.height);
            
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                log('ERROR: Could not get 2D context!');
                throw new Error('Could not get 2D context');
            }
            log('2D context obtained successfully');
            
            // Test basic drawing
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(10, 10, 100, 100);
            log('Test red rectangle drawn at (10,10)');
            
            // Test text drawing
            ctx.fillStyle = '#000000';
            ctx.font = '20px Arial';
            ctx.fillText('Test Text', 150, 50);
            log('Test text drawn');
            
            // Simple menu test
            let currentState = 'menu';
            let selectedButton = 0;
            
            const buttons = [
                { text: 'Start Game', x: 300, y: 300, width: 200, height: 60 },
                { text: 'Instructions', x: 300, y: 380, width: 200, height: 60 }
            ];
            
            function drawMenu() {
                try {
                    log('Drawing menu...');
                    
                    // Clear canvas
                    ctx.fillStyle = '#1a252f';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw title
                    ctx.fillStyle = '#ecf0f1';
                    ctx.font = 'bold 48px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('Quick Math Game', canvas.width / 2, 150);
                    
                    // Draw subtitle
                    ctx.font = '24px Arial';
                    ctx.fillStyle = '#bdc3c7';
                    ctx.fillText('Improve your arithmetic skills!', canvas.width / 2, 200);
                    
                    // Draw buttons
                    buttons.forEach((button, index) => {
                        const isSelected = index === selectedButton;
                        
                        // Button background
                        ctx.fillStyle = isSelected ? '#e74c3c' : '#3498db';
                        ctx.fillRect(button.x, button.y, button.width, button.height);
                        
                        // Button border
                        ctx.strokeStyle = isSelected ? '#c0392b' : '#2980b9';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(button.x, button.y, button.width, button.height);
                        
                        // Button text
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 20px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(
                            button.text,
                            button.x + button.width / 2,
                            button.y + button.height / 2 + 7
                        );
                    });
                    
                    // Instructions
                    ctx.font = '16px Arial';
                    ctx.fillStyle = '#95a5a6';
                    ctx.fillText('Use arrow keys to navigate, Enter to select', canvas.width / 2, canvas.height - 50);
                    
                    log('Menu drawn successfully with ' + buttons.length + ' buttons');
                } catch (error) {
                    log('ERROR in drawMenu: ' + error.message);
                }
            }
            
            function handleKeyPress(event) {
                try {
                    log('Key pressed: ' + event.code);
                    
                    if (currentState === 'menu') {
                        switch (event.code) {
                            case 'ArrowUp':
                                selectedButton = Math.max(0, selectedButton - 1);
                                log('Selected button: ' + selectedButton);
                                drawMenu();
                                break;
                            case 'ArrowDown':
                                selectedButton = Math.min(buttons.length - 1, selectedButton + 1);
                                log('Selected button: ' + selectedButton);
                                drawMenu();
                                break;
                            case 'Enter':
                                log('Enter pressed on button: ' + selectedButton);
                                if (selectedButton === 0) {
                                    log('Starting game...');
                                    alert('Game would start here!');
                                } else {
                                    log('Showing instructions...');
                                    alert('Instructions: Use arrow keys to move, collide with correct answers!');
                                }
                                break;
                        }
                    }
                } catch (error) {
                    log('ERROR in handleKeyPress: ' + error.message);
                }
            }
            
            function handleMouseClick(event) {
                try {
                    const rect = canvas.getBoundingClientRect();
                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;
                    
                    log('Mouse clicked at: (' + x + ', ' + y + ')');
                    
                    buttons.forEach((button, index) => {
                        if (x >= button.x && x <= button.x + button.width &&
                            y >= button.y && y <= button.y + button.height) {
                            log('Button ' + index + ' clicked: ' + button.text);
                            selectedButton = index;
                            drawMenu();
                            
                            if (index === 0) {
                                log('Starting game...');
                                alert('Game would start here!');
                            } else {
                                log('Showing instructions...');
                                alert('Instructions: Use arrow keys to move, collide with correct answers!');
                            }
                        }
                    });
                } catch (error) {
                    log('ERROR in handleMouseClick: ' + error.message);
                }
            }
            
            // Event listeners
            document.addEventListener('keydown', handleKeyPress);
            canvas.addEventListener('click', handleMouseClick);
            log('Event listeners added');
            
            // Initial draw
            drawMenu();
            log('Initial menu drawn');
            
            log('Debug simple game loaded successfully!');
            
        } catch (error) {
            log('FATAL ERROR: ' + error.message);
            log('Stack trace: ' + error.stack);
        }
    </script>
</body>
</html>
