<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quick Math Game</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Prevent scrolling on mobile */
        }
        
        #gameCanvas {
            border: 2px solid #34495e;
            background-color: #ecf0f1;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            max-width: 100vw;
            max-height: 100vh;
            display: block;
        }
        
        .game-container {
            text-align: center;
            width: 100%;
            max-width: 100vw;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        h1 {
            color: #ecf0f1;
            margin-bottom: 20px;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
        }
        
        /* Mobile-specific styles */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .game-container {
                padding: 5px;
            }
            
            h1 {
                margin-bottom: 10px;
                font-size: clamp(1.2rem, 5vw, 2rem);
            }
            
            #gameCanvas {
                border-width: 1px;
            }
        }
        
        /* Tablet-specific styles */
        @media (min-width: 769px) and (max-width: 1024px) {
            .game-container {
                padding: 15px;
            }
        }
        
        /* Landscape orientation on mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            h1 {
                display: none; /* Hide title in landscape to save space */
            }
            
            body {
                padding: 2px;
            }
            
            .game-container {
                padding: 2px;
            }
        }
        
        /* High DPI displays */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            #gameCanvas {
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Quick Math Game</h1>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    
    <!-- Core game modules -->
    <script src="js/utils/Vector2D.js"></script>
    <script src="js/core/Entity.js"></script>
    <script src="js/core/GameEngine.js"></script>
    <script src="js/systems/GameStateManager.js"></script>
    <script src="js/systems/ResponsiveSystem.js"></script>
    <script src="js/systems/InputSystem.js"></script>
    <script src="js/systems/PhysicsSystem.js"></script>
    <script src="js/systems/MathContentSystem.js"></script>
    <script src="js/systems/QuestionDisplaySystem.js"></script>
    <script src="js/systems/NumberTileSystem.js"></script>
    <script src="js/systems/ScoreSystem.js"></script>
    <script src="js/systems/HealthSystem.js"></script>
    <script src="js/systems/CollisionFeedbackSystem.js"></script>
    <script src="js/systems/LevelManager.js"></script>
    <script src="js/systems/AdaptiveLearningSystem.js"></script>
    <script src="js/systems/GameLogicSystem.js"></script>
    <script src="js/entities/PlayerCharacter.js"></script>
    <script src="js/entities/NumberTile.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
